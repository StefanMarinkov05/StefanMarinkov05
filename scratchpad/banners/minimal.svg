<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
  </defs>
  <style>
    .name{font:700 54px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3}
    .sub{font:400 19px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e;opacity:0;animation:in .8s 1s ease-out forwards}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.4s .2s ease-out forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    @keyframes in{to{opacity:1}}
  </style>
  <rect width="900" height="170" rx="16" fill="#0d1117"/>
  <text x="48" y="86" class="name">Stefan Marinkov</text>
  <rect x="50" y="104" width="300" height="4" rx="2" fill="url(#g)" class="bar"/>
  <text x="48" y="140" class="sub">backend | testing | ai agent security</text>
</svg>
