name: Profile art

# Redraws every animated graphic from the contribution graph and publishes them to the `output` branch.
# README and scratchpad/ load them from raw.githubusercontent.com/StefanMarinkov05/StefanMarinkov05/output/...

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-ocean.svg?color_snake=#00b4d8&color_dots=#caf0f8,#90e0ef,#48cae4,#0096c7,#023e8a
            dist/github-snake-lava.svg?color_snake=#ff006e&color_dots=#fff3b0,#ffca3a,#ff924c,#ff595e,#c1121f

      - name: Arcade games (Pac-Man, Galaga, Breakout, Tetris, ...)
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,galaga,breakout,puzzle-bobble,bomberman,minesweeper,snake,tetris"

      - name: 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect
        run: |
          mkdir -p dist/3d
          cp profile-3d-contrib/*.svg dist/3d/

          # Fallback "Activity" game (time-based); the README uses the random picker in worker/.
          # index = floor(unix_time / 10800) mod 6
          GAMES=(pacman galaga breakout puzzle-bobble bomberman snake)
          i=$(( ($(date +%s) / 10800) % ${#GAMES[@]} ))
          g=${GAMES[$i]}
          if [ "$g" = snake ]; then
            cp dist/github-snake.svg dist/activity.svg
            cp dist/github-snake-dark.svg dist/activity-dark.svg
          else
            cp "dist/$g-contribution-graph.svg" dist/activity.svg
            cp "dist/$g-contribution-graph-dark.svg" dist/activity-dark.svg
          fi
          echo "$g (slot $i, $(date -u +%FT%TZ))" > dist/activity.txt
          cat dist/activity.txt
          ls -R dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
